<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oratkovská Knižnica Saleziáni Bardejov</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2.119.2"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.12.1/dist/email.min.js"></script>

  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="js/app.js" defer></script>
</head>
<body>

<div class="container">
  <header>
    <h1><img class="site-symbol" src="doc/kniznica_logo_symbol.png" alt=""> Oratkovská knižnica Saleziáni Bardejov</h1>
  </header>

  <div class="account-bar">
    <div class="account-toolbar">
      <div class="account-identity">
        <div class="account-email">
          <strong>Účet:</strong>
          <span id="currentUserEmail">Neprihlásený</span>
        </div>
        <span id="adminStatus" class="account-role" hidden></span>
      </div>
      <div class="account-actions">
        <button type="button" data-action="open-user-borrows">📖 Moje výpožičky</button>
        <button type="button" id="signOutButton" data-action="sign-out" hidden>Odhlásiť sa</button>
      </div>
    </div>

    <form id="authForm" class="auth-form" novalidate>
      <input type="email" id="authEmail" autocomplete="email" required placeholder="Váš e-mail">
      <input type="password" id="authPassword" autocomplete="current-password" required minlength="8" placeholder="Heslo (aspoň 8 znakov)">
      <button type="submit">Prihlásiť sa</button>
      <button type="button" data-action="sign-up">Vytvoriť účet</button>
      <button type="button" class="btn-secondary" data-action="request-password-reset">Zabudnuté heslo</button>
    </form>
    <form id="resetPasswordForm" class="auth-form" novalidate hidden>
      <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="Nové heslo">
      <input type="password" id="confirmNewPassword" autocomplete="new-password" required minlength="8" placeholder="Zopakujte nové heslo">
      <button type="submit">Nastaviť nové heslo</button>
    </form>
  </div>

  <!-- Tlačidlá pre Admina -->
  <div id="adminControls" class="admin-only">
    <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
      <button type="button" class="btn-import" data-action="toggle-import">📥 Importovať Excel</button>
      <button type="button" data-action="open-admin-borrows">📋 Prehľad výpožičiek (Admin)</button>
    </div>

    <div id="importBox" class="import-box" style="display: none;">
      <h3 style="margin-bottom: 8px;">Import kníh z Excelu (.xlsx, .xls)</h3>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="margin-bottom: 10px; width: 100%;">
      <button type="button" class="btn-import" data-action="import-books" style="width: 100%;">Skontrolovať súbor</button>
      <div id="importProgress" role="status" aria-live="polite" style="margin-top: 10px; font-size: 13px; font-weight: bold; color: var(--primary);"></div>
      <div id="importPreview" aria-live="polite" style="display: none; max-height: 320px; overflow: auto; margin-top: 10px;"></div>
      <button type="button" id="confirmBookImportButton" class="btn-import" data-action="confirm-book-import" style="display: none; width: 100%; margin-top: 10px;">Potvrdiť a importovať nové knihy</button>
    </div>
  </div>

  <!-- Vyhľadávanie a filtre katalógu -->
  <div class="filter-bar">
    <div class="catalog-search-row">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 Názov knihy alebo autor..." aria-label="Vyhľadať knihu alebo autora">
      <button type="button" id="catalogFilterToggle" class="catalog-filter-toggle" data-action="toggle-catalog-filters" aria-expanded="false" aria-controls="catalogFilters">Filtre</button>
    </div>
    <div id="catalogFilters" class="catalog-filters">
      <select id="searchModeFilter" aria-label="Spôsob vyhľadávania">
        <option value="all">Názov/autor obsahuje</option>
        <option value="title-prefix">Názov začína na</option>
        <option value="author-prefix">Autor začína na</option>
      </select>
      <select id="categoryFilter" class="category-select" aria-label="Filtrovať podľa kategórie">
        <option value="">Všetky kategórie</option>
      </select>
      <select id="availabilityFilter" aria-label="Filtrovať podľa dostupnosti">
        <option value="all">Všetky knihy</option>
        <option value="available">Iba dostupné</option>
        <option value="unavailable">Iba nedostupné</option>
      </select>
      <button type="button" class="catalog-clear-filters" data-action="clear-catalog-filters">Vymazať filtre</button>
    </div>
  </div>

  <!-- Zoznam kníh v kartách -->
  <div id="booksGrid" class="books-grid">
    <p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Načítavam knihy...</p>
  </div>
  <nav id="bookPagination" class="book-pagination" aria-label="Stránkovanie katalógu" hidden>
    <button type="button" data-action="previous-books-page" aria-label="Predošlá strana">Predošlá</button>
    <span id="bookPaginationStatus" aria-live="polite"></span>
    <button type="button" data-action="next-books-page" aria-label="Ďalšia strana">Ďalšia</button>
  </nav>
</div>

<!-- MODAL 1: Požičanie knihy -->
<div id="borrowModal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="max-width: 450px;">
    <div class="modal-header">
      <h2>Požičať knihu</h2>
      <button type="button" class="btn-close" data-action="close-borrow">✕</button>
    </div>
    <div id="borrowModalBookTitle" style="font-weight: 700; margin-bottom: 15px; color: var(--primary);"></div>
    <form id="borrowForm" novalidate>
      <input type="hidden" id="borrowBookId">
      <div class="form-group">
        <label for="borrowName">Vaše meno a priezvisko:</label>
        <input type="text" id="borrowName" required placeholder="Napr. Ján Novák">
      </div>
      <button type="submit" style="width: 100%; padding: 12px; font-size: 15px;">Potvrdiť výpožičku</button>
    </form>
  </div>
</div>

<!-- MODAL 2: Moje výpožičky (Pre čitateľa) -->
<div id="userBorrowsModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📖 Moje výpožičky</h2>
      <button type="button" class="btn-close" data-action="close-user-borrows">✕</button>
    </div>
    <div id="userAuthSection" class="user-auth-section">
      <p>Po prihlásení sa tu zobrazia iba vaše aktívne výpožičky.</p>
    </div>
    <div id="userBorrowsList">
      <p style="text-align: center; color: var(--text-muted);">Na načítanie výpožičiek sa prihláste.</p>
    </div>
  </div>
</div>

<!-- MODAL 3: Prehľad výpožičiek (Pre Admina) -->
<div id="adminBorrowsModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📋 Prehľad výpožičiek (Admin)</h2>
      <button type="button" class="btn-close" data-action="close-admin-borrows">✕</button>
    </div>

    <!-- Filtre pre Admina -->
    <div class="admin-filter-bar">
        <select id="adminFilterSelect">
            <optgroup label="Pohľad: Zoznam výpožičiek">
            <option value="list-date-desc" selected>Najnovšie výpožičky</option>
            <option value="list-date-asc">Najstaršie výpožičky</option>
            <option value="list-email-asc">Podľa e-mailu (A-Z)</option>
            <option value="list-email-desc">Podľa e-mailu (Z-A)</option>
            </optgroup>
            <optgroup label="Pohľad: Agregovaný po používateľoch">
            <option value="user-count-desc">Podľa počtu kníh (od najviac)</option>
            <option value="user-email-asc">Podľa e-mailu (A-Z)</option>
            </optgroup>
        </select>
    </div>

    <div id="adminBorrowsList">
      <p style="text-align: center; color: var(--text-muted);">Načítavam výpožičky...</p>
    </div>
  </div>
</div>

<div id="feedbackModal" class="modal-overlay" style="display: none;">
  <div id="feedbackDialog" class="modal-content feedback-modal-content" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" aria-describedby="feedbackMessage" tabindex="-1">
    <span id="feedbackIcon" class="feedback-icon" aria-hidden="true"></span>
    <h2 id="feedbackTitle"></h2>
    <p id="feedbackMessage" role="status" aria-live="polite"></p>
    <div class="feedback-actions">
      <button type="button" id="feedbackConfirmButton" data-action="confirm-feedback" hidden></button>
      <button type="button" id="feedbackCloseButton" data-action="close-feedback">Zavrieť</button>
    </div>
  </div>
</div>
</body>
</html>
