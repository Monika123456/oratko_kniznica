<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oratkovská Knižnica</title>
  
  <!-- Načítanie Supabase z CDN (použité spoločné CDN) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <!-- Načítanie knižnice pre prácu s Excel súbormi (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Načítanie EmailJS knižnice -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <!-- Odkaz na externé CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Odkaz na externý JavaScript (spustí sa po načítaní HTML) -->
  <script src="js/app.js" defer></script>
</head>
<body>

<div class="container">
  <header>
    <h1>📚 Knižničný Katalóg</h1>
  </header>

  <!-- Užívateľská lišta -->
  <div class="user-bar">
    <div class="top-actions">
      <div>
        <strong>Prihlásený čitateľ:</strong> 
        <span id="currentUserEmail" style="color: var(--primary); font-weight: 600;">Neprihlásený</span>
      </div>
      <div>
        <button onclick="openUserBorrowsModal()" style="background: #0284c7;">📖 Moje výpožičky</button>
      </div>
    </div>
  </div>

  <!-- Prihlasovací blok pre admina (so zadaním e-mailu aj hesla) -->
  <div class="admin-bar">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <strong>Správa pre Admina</strong>
      <span id="adminStatus" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Status: Bežný používateľ</span>
    </div>
    <div class="admin-input-group">
      <input type="email" id="adminEmail" placeholder="E-mail admina">
      <input type="password" id="adminPassword" placeholder="Heslo">
      <button onclick="checkAdmin()">Prihlásiť ako Admin</button>
    </div>
  </div>

  <!-- Tlačidlá pre Admina -->
  <div id="adminControls" class="admin-only">
    <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
      <button onclick="toggleImportBox()" style="background: #059669;">📥 Importovať Excel</button>
      <button type="button" onclick="openAdminBorrowsModal()" style="background: #4f46e5;">📋 Prehľad výpožičiek (Admin)</button>
    </div>

    <div id="importBox" class="import-box" style="display: none;">
      <h3 style="margin-bottom: 8px;">Import kníh z Excelu (.xlsx, .xls)</h3>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="margin-bottom: 10px; width: 100%;">
      <button onclick="importBooksFromExcel()" style="background: #059669; width: 100%;">Spustiť import</button>
      <div id="importProgress" style="margin-top: 10px; font-size: 13px; font-weight: bold; color: var(--primary);"></div>
    </div>
  </div>

  <!-- Vyhľadávanie a Filter Kategórií -->
  <div class="filter-bar">
    <input type="text" id="searchInput" class="search-box" onkeyup="filterBooks()" placeholder="🔍 Vyhľadať knihu alebo autora...">
    <select id="categoryFilter" class="category-select" onchange="filterBooks()">
      <option value="">Všetky kategórie</option>
    </select>
  </div>

  <!-- Zoznam kníh v kartách -->
  <div id="booksGrid" class="books-grid">
    <p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Načítavam knihy...</p>
  </div>
</div>

<!-- MODAL 1: Požičanie knihy -->
<div id="borrowModal" class="modal-overlay" style="display: none;">
  <div class="modal-content" style="max-width: 450px;">
    <div class="modal-header">
      <h2>Požičať knihu</h2>
      <button class="btn-close" onclick="closeBorrowModal()">✕</button>
    </div>
    <div id="borrowModalBookTitle" style="font-weight: 700; margin-bottom: 15px; color: var(--primary);"></div>
    <form id="borrowForm" onsubmit="submitBorrowForm(event)">
      <input type="hidden" id="borrowBookId">
      <div class="form-group">
        <label for="borrowName">Vaše meno a priezvisko:</label>
        <input type="text" id="borrowName" required placeholder="Napr. Ján Novák">
      </div>
      <div class="form-group">
        <label for="borrowEmail">Váš e-mail:</label>
        <input type="email" id="borrowEmail" required placeholder="jan.novak@example.com">
      </div>
      <button type="submit" style="width: 100%; padding: 12px; font-size: 15px;">Potvrdiť výpožičku</button>
    </form>
  </div>
</div>

<!-- MODAL 2: Moje výpožičky (Pre čitateľa) -->
<div id="userBorrowsModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📖 Moje výpožičky</h2>
      <button class="btn-close" onclick="closeUserBorrowsModal()">✕ Zavrieť</button>
    </div>
    <div id="userAuthSection" style="margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 10px;">
      <label for="userModalEmail" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px;">Zadajte e-mail pre načítanie vašich kníh:</label>
      <div style="display: flex; gap: 8px;">
        <input type="email" id="userModalEmail" placeholder="jan.novak@example.com" style="flex: 1;">
        <button onclick="loadUserBorrows()">Načítať</button>
      </div>
    </div>
    <div id="userBorrowsList">
      <p style="text-align: center; color: var(--text-muted);">Zadajte váš e-mail vyššie.</p>
    </div>
  </div>
</div>

<!-- MODAL 3: Prehľad výpožičiek (Pre Admina) -->
<div id="adminBorrowsModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📋 Prehľad výpožičiek (Admin)</h2>
      <button class="btn-close" onclick="closeAdminBorrowsModal()">✕ Zavrieť</button>
    </div>

    <!-- Filtre pre Admina -->
    <div class="admin-filter-bar">
        <select id="adminFilterSelect" onchange="renderAdminBorrows()">
            <optgroup label="Pohľad: Zoznam výpožičiek">
            <option value="list-date-desc" selected>Najnovšie výpožičky</option>
            <option value="list-date-asc">Najstaršie výpožičky</option>
            <option value="list-email-asc">Podľa e-mailu (A-Z)</option>
            <option value="list-email-desc">Podľa e-mailu (Z-A)</option>
            </optgroup>
            <optgroup label="Pohľad: Agregovaný po používateľoch">
            <option value="user-count-desc">Podľa počtu kníh (od najviac)</option>
            <option value="user-email-asc">Podľa e-mailu (A-Z)</option>
            </optgroup>
        </select>
    </div>

    <div id="adminBorrowsList">
      <p style="text-align: center; color: var(--text-muted);">Načítavam výpožičky...</p>
    </div>
  </div>
</div>
</body>
</html>
